; PlatformIO Project Configuration File
;
; Due ambienti: firmware per il Mega e test della libreria di dominio sul PC.
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = megaatmega2560

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -Wall -Wextra -DFW_VERSION=\"2.1.0\"
lib_deps =
	paulstoffregen/Encoder@^1.4.4
	chris--a/Keypad@^3.1.1
	mathertel/OneButton@^2.6.1

; Build di prova del watchdog (REQ-2.2, #43): il loop si blocca 3 s dopo l'avvio di un'Esposizione.
; Solo per il collaudo sulla scheda, mai da lasciare caricata.
[env:wdt_test]
extends = env:megaatmega2560
build_flags = ${env:megaatmega2560.build_flags} -DWDT_TEST

[env:native]
platform = native
test_framework = unity
; I testi tradotti non fanno mai da formato senza argomenti (#39): sul PC printf ha l'attributo format.
build_flags = -std=gnu++17 -Wall -Wextra -Werror=format-security
lib_ignore = Encoder, Keypad, OneButton
