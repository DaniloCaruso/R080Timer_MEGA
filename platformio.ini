[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
lib_deps = 
	paulstoffregen/Encoder@^1.4.4
	chris--a/Keypad@^3.1.1
	marcoschwartz/LiquidCrystal_I2C@^1.1.4
	stutchbury/EncoderButton@^1.0.6
	mike-matera/ArduinoSTL@^1.3.3

[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps = 
	paulstoffregen/Encoder@^1.4.4
	chris--a/Keypad@^3.1.1
	marcoschwartz/LiquidCrystal_I2C@^1.1.4
	stutchbury/EncoderButton@^1.0.6
	mike-matera/ArduinoSTL@^1.3.3
