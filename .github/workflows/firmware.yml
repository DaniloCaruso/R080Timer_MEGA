name: firmware

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      # REQ-11.1: la libreria di dominio non include header Arduino né AVR
      - run: "! grep -rnE '#include *[<\"](Arduino|avr/|util/)' lib/r080_core"
      - run: pio run -e megaatmega2560
      - run: pio test -e native
